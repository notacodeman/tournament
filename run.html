<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your run · Tournament</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0E13'/%3E%3Cpath d='M7 24L13 8M13 24L19 8M19 24L25 8' stroke='%23FF9F1C' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<!-- The racer's private link to one submitted run: run?id=<token>. Shows whether it was verified or why it was rejected. -->
<body>
<header class="banner"><div class="wrap">
  <a class="logo" href="./" title="Back to the start"><span class="logo-mark" aria-hidden="true"></span><span class="logo-text">Tournament</span></a>
  <a class="home-link" href="https://codeman.club">← codeman.club</a>
</div></header>
<main class="wrap form-page">
  <h1 style="font-size: clamp(34px, 7vw, 48px); font-style: italic; margin: 0 0 18px">Your run</h1>
  <div id="out"><p class="muted">Loading…</p></div>
</main>
<footer class="site-foot"><div class="wrap">
  <span>tournament.codeman.club · Times are checked by each tournament's organizers.</span>
  <a href="https://github.com/notacodeman/tournament" target="_blank" rel="noopener">Source on GitHub</a>
</div></footer>
<script type="module">
import { $, el, api, formatDate } from './js/util.js';
import { formatTime } from './lib/time.js';
const token = new URLSearchParams(location.search).get('id') || '';
const label = { pending: 'Waiting for review', verified: 'Verified: it counts', rejected: 'Rejected' };
try {
  const { run } = await api(`/api/runs/${encodeURIComponent(token)}`);
  $('#out').replaceChildren(el('div.panel.panel-pad', { style: { display: 'grid', gap: '10px' } },
    el('span', {}, el(`span.chip.${run.status}`, {}, label[run.status])),
    el('div.time.mono', { style: { fontSize: '40px', fontWeight: 700, color: 'var(--teal)' } }, formatTime(run.time_ms)),
    el('div', {}, `${run.racer} · ${run.track} · ${run.cls}${run.platform ? ' · ' + run.platform : ''}`),
    run.penalty_ms ? el('div.flag', {}, `+${(run.penalty_ms / 1000).toFixed(3)} s penalty${run.penalty_note ? ': ' + run.penalty_note : ''}`) : '',
    run.status === 'rejected' ? el('div.message.error', {}, `Reason: ${run.reject_reason}`) : '',
    el('div.small.muted', {}, `Submitted ${formatDate(run.submitted_at, true)}${run.reviewed_at ? ' · reviewed ' + formatDate(run.reviewed_at, true) : ''}`),
    el('div', {}, el('a', { href: `./?t=${encodeURIComponent(run.slug)}` }, `See the ${run.tournament_name} standings`))));
} catch (err) {
  $('#out').replaceChildren(el('div.message.error', {}, err.message));
}
</script>
</body>
</html>
