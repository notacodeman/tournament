<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timer · Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<!-- The race timer in its own window. Stays in sync with the timer on the tournament page.
     ?clean=1 shows only the clock and label (for OBS window capture); ?bg=transparent drops the background.
     Keys: Space start/pause, L lap, R reset (not while typing). -->
<body class="timer-page">
<main class="timer-window panel" id="timer"></main>
<p class="timer-help small muted" id="help">Space start/pause · L lap · R reset · add <b>?clean=1</b> to the address for a clock-only view to capture in OBS</p>
<script type="module">
import { mountTimer, timer } from './js/timer.js';

const q = new URLSearchParams(location.search);
if (q.get('clean') === '1') document.body.classList.add('clean');
if (q.get('bg') === 'transparent') document.body.classList.add('transparent');
mountTimer(document.getElementById('timer'));

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); timer.toggle(); }
  else if (e.key.toLowerCase() === 'l') timer.lap();
  else if (e.key.toLowerCase() === 'r') timer.reset();
});
</script>
</body>
</html>
